name: Build servers with Clang on macos
# build_servers_cmake_osx.yml

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      # This workflow should run when
      # 1) its own workflow configuration file was changed
      - '.github/workflows/build_servers_cmake_osx.yml'
      # 2) a source code file in the src directory was changed
      - 'src/**'
      # 3) a source code file in the 3rdparty directory was changed
      - '3rdparty/**'
      # 4) a CMake related file was changed
      - '**/CMakeLists.txt'

jobs:
  build:
    # Github Actions checks for '[ci skip]', '[skip ci]', '[no ci]', '[skip actions]', or '[actions skip]' but not a hyphenated version.
    # It's a catch-all incase a Pull Request has been opened and someone is on auto-pilot.
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
          os: [macos-15, macos-26]

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        # Macos runners already have most of the packages rAthena requires to build.
        # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
        # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
        run: |
          brew install pcre
          brew install mysql
          brew install mysql-client

      # Install latest CMake.
      - uses: lukka/get-cmake@latest

      - name: Create build directory
        run: mkdir cbuild

      - name: Create Unix Makefiles
        run: |
          cd cbuild
          cmake ..

      - name: Command - make
        run: |
          cd cbuild
          make
