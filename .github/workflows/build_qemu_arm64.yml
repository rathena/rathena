name: Build ARM64 via QEMU (Renewal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      
      - uses: docker/setup-qemu-action@49b3c7efd1e9c1e675f475912cf84a04509c4e85  # v3.2.0

      - name: Compile inside ARM64 container
        run: |
          docker run --rm -v $PWD:/build -w /build arm64v8/ubuntu:22.04 /bin/bash -c "
            apt update &&
            apt install -y git make gcc g++ libpcre3-dev zlib1g-dev &&
            ./configure --disable-prere &&
            make -j\$(nproc) server
          "

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: rathena-arm64-renewal
          path: |
            login-server
            char-server
            map-server
