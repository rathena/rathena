  - Id: 490966
    AegisName: 6th_Anni_Ring_TH
    Name: "6th Anniversary Ayothaya Ring"
    Type: Armor
    Weight: 200
    Defense: 0
    Slots: 1
    Locations:
      Left_Accessory: true
    ArmorLevel: 2
    EquipLevelMin: 200
    Refineable: true
    Gradable: true
    Script: |
      .@r = getrefine();
      .@g = getenchantgrade();
      bonus bAllStats,6;
      bonus bAllTraitStats,6;
      bonus bShortAtkRate,.@r;
      bonus bLongAtkRate,.@r;
      bonus bMatkRate,.@r;
      if (.@r>=7) {
         bonus bPAtk,3;
         bonus bSMatk,3;
         if (.@r>=9) {
            bonus bDelayRate,-10;
            if (.@r>=12) {
               bonus2 bAddRace,RC_All,10;
               bonus2 bAddRace,RC_Player_Human,-10;
               bonus2 bAddRace,RC_Player_Doram,-10;
               bonus2 bMagicAddRace,RC_All,10;
               bonus2 bMagicAddRace,RC_Player_Human,-10;
               bonus2 bMagicAddRace,RC_Player_Doram,-10;
            }
         }
      }
      if (.@g>=ENCHANTGRADE_D) {
         bonus bFixedCast,-300;
         if (.@g>=ENCHANTGRADE_C) {
            bonus2 bSubClass,Class_Boss,10;
            if (.@g>=ENCHANTGRADE_B) {
               bonus bRes,60;
               bonus bMRes,60;
               bonus bFlee2,20;
               if (.@g>=ENCHANTGRADE_A) {
                  bonus2 bDropAddClass,Class_All,3;
                  bonus2 bIgnoreDefRaceRate,RC_All,40;
                  bonus2 bIgnoreDefRaceRate,RC_Player_Human,-40;
                  bonus2 bIgnoreDefRaceRate,RC_Player_Doram,-40;
                  bonus2 bIgnoreMdefRaceRate,RC_All,40;
                  bonus2 bIgnoreMdefRaceRate,RC_Player_Human,-40;
                  bonus2 bIgnoreMdefRaceRate,RC_Player_Doram,-40;
               }
            }
         }
      }
