  - Id: 400974
    AegisName: Great_Yoyo_US
    Name: Future Yoyo King Hat
    Type: Armor
    Weight: 200
    Defense: 50
    Slots: 1
    Locations:
      Head_Top: true
    ArmorLevel: 2
    EquipLevelMin: 100
    Refineable: true
    Gradable: true
    View: 391
    Script: |
      .@g = getenchantgrade();
      .@r = getrefine();
      bonus bUnbreakableHelm;
      bonus bASPD,10;
      bonus2 bAddSize,Size_All,20+(7*(.@r/2));
      if (BaseClass == Job_Novice && BaseLevel >= 200) {
         bonus bMaxHP,50000;
         bonus bMaxSP,5000;
         bonus2 bExpAddClass,Class_All,50;
      }
      bonus bPow,.@r/2;
      bonus bAllStats,7*(.@r/3);
      if (.@r>=10) {
         bonus2 bAddSize,Size_All,15;
         if (.@r>=11) {
            bonus bAllTraitStats,7;
            bonus bBaseAtk,70;
            bonus5 bAutoSpell,"HN_MEGA_SONIC_BLOW",10,50,BF_SHORT|BF_LONG,1;
            if (.@r>=12) {
               bonus bAllTraitStats,7;
               bonus bBaseAtk,70;
               bonus5 bAutoSpell,"HN_SPIRAL_PIERCE_MAX",10,70,BF_SHORT|BF_LONG,1;
               if (.@r>=13) {
                  bonus bAllStats,20;
                  bonus bBaseAtk,200;
                  bonus5 bAutoSpell,"HN_DOUBLEBOWLINGBASH",10,150,BF_SHORT|BF_LONG,1;
                  if (.@r>=14) {
                    bonus bDelayRate,-25;
                    bonus bBaseAtk,250;
                    bonus bFixedCast,-500;
                  }
               }
            }
         }
      }
      if (getpetinfo(PETINFO_EGGID) == 9016) {
         if (getpetinfo(PETINFO_INTIMATE) >= PET_INTIMATE_LOYAL) {
            bonus bAllStats,5;
            bonus bAllTraitStats,5;
            bonus bSpeedRate,25;
         }
      }
      if (.@g>=ENCHANTGRADE_D) {
         bonus bPAtk,15;
         if (.@g>=ENCHANTGRADE_C) {
            bonus bMaxHPRate,20;
            bonus bMaxSPRate,20;
            if (.@g>=ENCHANTGRADE_B) {
               bonus2 bIgnoreDefRaceRate,RC_All,50;
               if (.@g>=ENCHANTGRADE_A) {
                  bonus bAllStats,8;
                  bonus bAllTraitStats,8;
               }
            }
         }
      }
