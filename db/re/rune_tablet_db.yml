#       Item                Reward item ID.
#   Upgrades:               Upgrade table covering all 15 target levels. (Set only, Default: none)
#     - Level               Target level. (1-15)
#       Chance              Base success chance. (100000 = 100%)
#       FailureIncrement    Chance added per failed attempt at this level. (100000 = 100%)
#       Materials:          Cost of one attempt.
#         - Item            Item ID.
#           Amount          Amount. (1-MAX_AMOUNT)
###########################################################################
